name: Deploy

# Fires automatically once the "Build and Test" workflow (ci.yml) finishes
# successfully on main — never on a failed or in-progress build, and never
# directly on push (that's what Build and Test itself reacts to). Also
# runnable by hand from the Actions tab (workflow_dispatch) for a manual
# redeploy without needing a new commit — handy for demoing this assignment.
on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    # Only proceed on an actual successful Build and Test run. For a manual
    # workflow_dispatch run there's no workflow_run event object at all, so
    # this only short-circuits the automatic trigger path.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend + database to the class server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          # If the class server uses an SSH key instead of a password,
          # delete the "password:" line above and uncomment this one
          # (add a DEPLOY_SSH_KEY secret containing the private key's full
          # contents instead of DEPLOY_PASSWORD):
          # key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script: |
            set -e
            REPO_DIR=~/needledrop

            # First deploy ever on this server: clone. Every deploy after
            # that: just fetch+reset to whatever just passed Build and Test,
            # so the server always ends up running exactly what main has,
            # not whatever happened to be there before.
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/${{ github.repository }}.git "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            # Only the backend + database services are deployed here — the
            # frontend is a WPF desktop app (frontend/Dockerfile only
            # builds it as a downloadable .exe, it can't run headless on a
            # Linux server; see that Dockerfile's own comment). This is the
            # app the assignment's "URL for your up and running
            # application" deliverable points at — http://<server>:<port>/swagger
            # once this finishes.
            #
            # "sudo" here: a plain non-root user on a shared class Docker
            # server usually can't talk to /var/run/docker.sock directly
            # (only root or members of the "docker" group can) — this
            # showed up as "permission denied while trying to connect to
            # the docker API at unix:///var/run/docker.sock". Many class
            # servers grant students passwordless sudo specifically for
            # Docker commands, so trying that first. If this step still
            # fails with something like "sudo: a password is required" or
            # "jcollazo is not in the sudoers file", sudo isn't set up that
            # way here either, and the real fix has to happen server-side —
            # ask whoever admins the server to add this account to the
            # "docker" group (sudo usermod -aG docker <username>, then a
            # fresh login), which is the standard, permanent way to grant
            # Docker access without sudo at all.
            # Note: "sudo VAR=value command" does NOT work the way it does
            # in a plain shell — sudo doesn't pass through an inline
            # assignment like that, it just tries (and fails) to run a
            # program literally named "VAR=value". "sudo env VAR=value
            # command" is the correct way to run a command as root with an
            # environment variable set.
            sudo env BACKEND_EXTERNAL_PORT=${{ secrets.DEPLOY_EXTERNAL_PORT }} \
              docker compose up -d --build backend database
